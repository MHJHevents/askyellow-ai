<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskYellow – Mijn account</title>
    <style>
        body {
            font-family: Poppins, sans-serif;
            background: #020309;
            color: #fff;
            text-align: center;
            padding: 40px 20px;
        }

        .box {
            background: #111;
            padding: 25px;
            border-radius: 14px;
            max-width: 520px;
            margin: 0 auto;
            box-shadow: 0 0 30px rgba(255,215,0,0.25);
            text-align: left;
        }

        h2, h3 {
            text-align: center;
        }

        .row {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            opacity: 0.85;
        }

        input {
            width: 100%;
            height: 46px;
            line-height: 46px;
            padding: 0 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #222;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }

        .readonly {
            opacity: 0.7;
        }

        .meta {
            margin-top: 18px;
            padding: 14px;
            border-radius: 10px;
            background: #181818;
            line-height: 1.6;
        }

        .status-ok {
            color: #7CFF7C;
        }

        .status-warn {
            color: #FFD700;
        }

        .error {
            color: #ff6666;
            margin-top: 10px;
        }

        .success {
            color: #7CFF7C;
            margin-top: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #FFD700;
            color: #111;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 12px;
        }

        .btn-secondary {
            background: transparent;
            color: #FFD700;
            border: 2px solid #FFD700;
        }

        a {
            color: #FFD700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h2>Mijn account</h2>

    <div class="box">
        <form id="accountForm">
            <div class="row">
                <label for="firstName">Voornaam</label>
                <input id="firstName" type="text" required>
            </div>

            <div class="row">
                <label for="lastName">Achternaam</label>
                <input id="lastName" type="text" required>
            </div>

            <div class="row">
                <label for="email">Email</label>
                <input id="email" type="email" class="readonly" readonly>
            </div>

            <button type="submit">Gegevens opslaan</button>
            <button type="button" id="logoutBtn" class="btn-secondary">Uitloggen</button>

            <div id="successBox" class="success"></div>
            <div id="errorBox" class="error"></div>
        </form>

        <div class="meta" id="metaBox">
            Account laden...
        </div>

        <p style="text-align:center; margin-top:18px;">
            <a href="/chat.html">← Terug naar chat</a>
        </p>
    </div>

    <script src="/js/account.js" defer></script>
</body>
</html>
