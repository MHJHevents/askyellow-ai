<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AskYellow – Account aanmaken</title>

    <style>
        body {
            font-family: Poppins, sans-serif;
            background: #020309;
            color: #fff;
            text-align: center;
            padding: 40px 20px;
        }

        .box {
            background: #111;
            padding: 25px;
            border-radius: 14px;
            max-width: 450px;
            margin: 0 auto;
            box-shadow: 0 0 30px rgba(255,215,0,0.25);
        }

        input {
            width: 100%;
            height: 48px;
            line-height: 48px;
            padding: 0 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #222;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }


        button {
            width: 100%;
            padding: 12px;
            background: #FFD700;
            color: #111;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
        }

        a {
            color: #FFD700;
        }

        .error {
            color: #ff5555;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .password-wrap {
            position: relative;
            width: 100%;
            margin: 10px 0;
        }
            .password-wrap input {
                padding-right: 44px;
            }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        .input-wrap {
            width: 100%;
            margin: 10px 0;
            position: relative;
        }

        .password-wrap input {
            padding-right: 44px;
        }

    </style>
</head>
<body>

    <h2>Account aanmaken</h2>

    <div class="box">
        <div class="error" id="errorBox"></div>

        <!-- ✅ FORM TOEGEVOEGD -->
        <form id="registerForm" autocomplete="on">

            <div class="input-wrap">
                <input id="firstName" type="text" placeholder="Voornaam" required />
            </div>

            <div class="input-wrap">
                <input id="lastName" type="text" placeholder="Achternaam" required />
            </div>

            <div class="input-wrap">
                <input id="email" type="email" placeholder="Emailadres" required />
            </div>

            <div class="input-wrap password-wrap">
                <input id="password" type="password" placeholder="Wachtwoord (min. 6 tekens)" required />
                <span class="toggle-password" data-target="password">👁️</span>
            </div>

            <div class="input-wrap password-wrap">
                <input id="password2" type="password" placeholder="Herhaal wachtwoord" required />
                <span class="toggle-password" data-target="password2">👁️</span>
            </div>



            <button type="submit">Registreren</button>
        </form>

        <p style="margin-top:10px;">
            Al een account? <a href="login.html">Inloggen</a>
        </p>
    </div>


    <script src="/js/register.js" defer></script>

</body>
</html>
