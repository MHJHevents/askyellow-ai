<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – AskYellow</title>
  <meta name="description" content="Neem contact op met AskYellow – wij helpen je graag verder.">
  <link rel="canonical" href="https://askyellow.nl/contact.html">
  <style>
    body {
      font-family: "Poppins", Arial, sans-serif;
      background-color: #0e0e0e;
      color: #f5f5f5;
      margin: 0;
      padding: 0;
      line-height: 1.7;
    }

    header {
      background: #111;
      padding: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      border-bottom: 2px solid #FFD700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    .nav {
      display: flex;
      gap: 30px;
    }

    .nav a {
      color: #FFD700;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s ease-in-out;
    }

    .nav a:hover {
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
    }

    .container {
      max-width: 800px;
      margin: 60px auto;
      background: #1a1a1a;
      padding: 40px 50px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
      animation: fadeIn 0.8s ease-in-out;
    }

    h1 {
      color: #FFD700;
      text-align: center;
      font-size: 2rem;
      margin-bottom: 1em;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    p {
      color: #ddd;
      text-align: center;
      margin-bottom: 2em;
    }

    form {
      background: #111;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
    }

    label {
      display: block;
      margin-top: 1em;
      font-weight: 600;
      color: #FFD700;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border-radius: 12px;
      border: 2px solid #333;
      background: #222;
      color: #fff;
      font-family: inherit;
      font-size: 1em;
      transition: 0.3s;
    }

    input:focus, textarea:focus {
      border-color: #FFD700;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
      outline: none;
    }

    button {
      margin-top: 20px;
      background-color: #FFD700;
      border: none;
      color: #000;
      padding: 12px 26px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      transition: 0.3s ease;
      width: 100%;
    }

    button:hover {
      background-color: #fff200;
      box-shadow: 0 0 10px rgba(255, 255, 0, 0.6);
    }

    footer {
      margin-top: 60px;
      text-align: center;
      padding: 25px 10px;
      border-top: 2px solid #FFD700;
      color: #ccc;
      font-size: 0.9rem;
      background: #111;
    }

    footer em {
      color: #FFD700;
      font-weight: 600;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .container {
        margin: 30px 15px;
        padding: 25px 20px;
      }

      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="about.html">Over</a>
      <a href="contact.html">Contact</a>
      <a href="https://shop.askyellow.nl" target="_blank">Shop</a>
    </nav>
  </header>

  <div class="container">
    <h1>Contact</h1>
    <p>Heb je een vraag, suggestie of wil je gewoon hallo zeggen?<br>
    Vul het formulier hieronder in en we nemen zo snel mogelijk contact met je op.</p>

    <form action="contact.php" method="POST">
      <label for="name">Naam</label>
      <input type="text" id="name" name="name" required>

      <label for="email">E-mailadres</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Bericht</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit">Versturen</button>
    </form>
  </div>

  <footer>
    <p>© <span id="year"></span> AskYellow – <em>Your World. Your Answers.</em></p>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
<script>
  const lang = navigator.language || navigator.userLanguage;
  if (lang.startsWith("en")) {
    if (window.location.pathname.includes("index.html")) {
      window.location.href = "index-en.html";
    } else if (window.location.pathname.includes("about.html")) {
      window.location.href = "about-en.html";
    } else if (window.location.pathname.includes("contact.html")) {
      window.location.href = "contact-en.html";
    }
  }
</script>

</body>
</html>
