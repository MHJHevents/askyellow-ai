<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    margin: 0;
    padding: 20px;
    background: transparent;
    font-family: "Poppins", Arial, sans-serif;
    color: #eee;
  }

  /* Centered layout container */
  .main-inner {
    max-width: 1200px;
    margin: 0 auto;
  }

  .watermark {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 650px;
    height: 650px;
    background: url("logo_big.png") no-repeat center center;
    background-size: contain;
    opacity: 0.14;                    /* feller */
    transform: translate(-50%, -50%);
    z-index: -1;
    pointer-events: none;
    filter: brightness(1.25);         /* zorgt voor helderheid zonder overbelichting */
}


  h1 {
    text-align: center;
    margin: 0 0 20px;
    font-size: 1.8rem;
    color: #FFD100;
  }

  .search-container {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px auto;
  }

  #searchInput {
    width: 55%;
    padding: 14px 18px;
    font-size: 1.1rem;
    border-radius: 12px;
    border: 1px solid #444;
    background: #111;
    color: #fff;
  }

  .search-btn {
    padding: 14px 22px;
    border: none;
    border-radius: 12px;
    background: #FFD100;
    color: #000;
    font-size: 1.1rem;
    cursor: pointer;
    font-weight: bold;
  }

  /* AI ANSWER BOX */
  #answerBox {
    margin-top: 25px;
    padding: 15px;
    background: rgba(20,20,20,0.9);
    border: 1px solid #333;
    border-radius: 16px;
    display: none;
  }

  .answer-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .yello-avatar {
    width: 48px;
    height: 48px;
    object-fit: contain;
    border-radius: 0;
  }

  .answer-title {
    color: #FFD100;
    font-weight: 700;
    font-size: 1rem;
  }

  /* WEB RESULTS */
  #webResults {
    margin-top: 30px;
    display: none;
  }

  #webResults h2 {
    color: #FFD100;
    margin-bottom: 10px;
    font-size: 1.1rem;
  }

  .web-item {
    background: #151515;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #333;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background .2s;
  }

  .web-item:hover {
    background: #202020;
  }

  .web-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
  }

  .result-snippet {
    font-size: 14px;
    color: #ccc;
    margin-top: 4px;
  }

  .result-url {
    font-size: 12px;
    color: #888;
    margin-top: 2px;
  }

  /* SHOPIFY SEARCH RESULTS PANEL */
  #shopResults {
    margin-top: 30px;
    display: none;
  }

  #shopResults h2 {
    color: #FFD100;
    margin-bottom: 12px;
    font-size: 1.1rem;
  }

  .result-item {
    display: flex;
    gap: 14px;
    background: #151515;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1px solid #333;
    cursor: pointer;
    transition: background .2s;
  }

  .result-item:hover {
    background: #202020;
  }

  .result-thumb {
    width: 75px;
    height: 75px;
    object-fit: cover;
    border-radius: 8px;
  }

  .result-info {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .result-title {
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 5px;
    color: #fff;
  }

  .price-line {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .price {
    font-size: 1rem;
    font-weight: 700;
    color: #FFD100;
  }

  .compare {
    text-decoration: line-through;
    color: #888;
    font-size: 0.85rem;
  }

  .badge-sale {
    background: #ff3b3b;
    color: #fff;
    padding: 3px 6px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 700;
  }

  /* KNOWLEDGE RESULTS */
  #kbResults {
    margin-top: 30px;
    display: none;
  }

  #kbResults h2 {
    color: #FFD100;
    margin-bottom: 8px;
    font-size: 1.05rem;
  }

  .kb-box {
    background: #151515;
    border-radius: 10px;
    border: 1px solid #333;
    padding: 10px 12px;
    font-size: 0.9rem;
    color: #ddd;
  }
    .search-top-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 20px;
        margin-top: 25px;
    }

    /* AI uitleg */
    .ai-box #answerBox {
        display: block; /* JS mag 'm aanzetten */
        margin-top: 0;
    }

    /* Opties rechts */
    .option-box {
        background: rgba(20,20,20,0.9);
        border: 1px solid #333;
        border-radius: 16px;
        padding: 15px;
    }

        .option-box h3 {
            color: #FFD100;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        .option-box a {
            display: block;
            color: #eee;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

            .option-box a:hover {
                text-decoration: underline;
            }
    .affiliate-note {
        margin-top: 10px;
        font-size: 0.75rem;
        color: #888;
    }

    #affiliateLinks a {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
        color: #eee;
        text-decoration: none;
    }

        #affiliateLinks a:hover {
            text-decoration: underline;
        }

    #showAffiliateOptions {
        display: inline-block;
        padding: 10px 16px;
        background: #FFD100;
        color: #000;
        border-radius: 10px;
        border: none;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
    }



</style>
</head>

<body>

    <div class="watermark"></div>

    <div class="main-inner">
        <h1>AskYellow Search</h1>

        <form id="askyellow-form" class="search-container" onsubmit="runSearch(); return false;">
            <input id="searchInput" type="text" placeholder="Waar ben je naar op zoek?">
            <button type="submit" class="search-btn">🔍</button>
            <button id="searchCloseBtn" type="button">×</button>
        </form>

        <!-- AI Answer -->


        <div class="search-top-grid">

            <!-- opties vlak -->

            <div class="ai-box">
                <div id="answerBox">
                    <div class="answer-header">
                        <img src="yello_medium.png" alt="Yello" class="yello-avatar">
                        <div class="answer-title">YellowMind zegt:</div>
                    </div>
                    <div id="answerText"></div>
                    <div id="searchActions" style="display:none; margin-top:12px; gap:10px;">
                        <button id="btnRefine" type="button">Verder verfijnen</button>
                        <button id="btnNewSearch" type="button">Nieuwe zoekopdracht</button>
                    </div>
                </div>
            </div>
            <div class="option-box" id="affiliateBox" style="display:none;">
                <div id="affiliate-section" style="display:none;"></div>

                <h3>Waar wil je kijken?</h3>
                <div id="affiliateLinks"></div>
                <div class="affiliate-note">
                    <button id="showAffiliateOptions">Laat nu opties zien</button>
                    Partnerlinks (testomgeving)
                </div>
            </div>
        </div>

        <!-- WEB RESULTS -->
        <div id="webResults">
            <h2>🌐 Webresultaten</h2>
            <div id="webList"></div>
        </div>

        <!-- Shopify Results -->
        <div id="shopResults">
            <h2>🛒 Resultaten uit de AskYellow Shop</h2>
            <div id="resultList"></div>
        </div>

        <!-- Knowledge Results -->
        <div id="kbResults">
            <h2>📘 AskYellow kennisbank</h2>
            <div id="kbBox" class="kb-box"></div>
        </div>
    </div>
    
    <script type="module" src="/js/search.js"></script>
    /

</body>
</html>
